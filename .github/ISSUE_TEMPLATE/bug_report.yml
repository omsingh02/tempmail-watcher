name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please don't paste codes or links you still need.
        Security problems should be reported privately: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `tempmail -p mailtm --json`
        2. Send a verification email to the address
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tempmail version
      description: Output of `tempmail --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (Wayland)
        - Linux (X11)
        - macOS
        - Windows
        - WSL
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - GuerrillaMail
        - Mail.tm
        - Not provider-specific
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant terminal output. Run with `--json` if possible.
      render: shell
